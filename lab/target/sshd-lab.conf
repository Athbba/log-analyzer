# Lab settings on top of Debian's defaults.

# The scenarios guess passwords, so password logins must be possible.
PasswordAuthentication yes
KbdInteractiveAuthentication no
# Root can't log in with a password, but sshd still logs each guess as
# "Failed password for root", exactly as on a real server.
PermitRootLogin prohibit-password

# OpenSSH 9.8+ penalizes sources that fail to authenticate by refusing their
# connections for a while. That is good on a real server, but it would make
# the scenarios' timing depend on the penalty clock. Turned off in the lab;
# see lab/README.md.
PerSourcePenalties no

UseDNS no
MaxStartups 100:30:200
LogLevel INFO
