# Weekly update PRs for the dev dependencies and the pinned Actions. The
# cooldown waits two weeks after a release before proposing it
# (docs/adr/0003-dependency-policy.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      dev-tools:
        patterns: ['*']
    ignore:
      # Majors that docs/adr/0004 rules out: @types/node follows the oldest
      # supported Node (22), and TypeScript stays on 6.x for checkJs.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci(deps)
