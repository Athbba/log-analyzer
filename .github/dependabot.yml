# Weekly update PRs for the dev dependencies and the pinned Actions. The
# cooldown waits two weeks after a release before proposing it
# (docs/adr/0003-dependency-policy.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      dev-tools:
        patterns: ['*']
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci(deps)
